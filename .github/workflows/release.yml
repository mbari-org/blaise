name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and Release
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_suffix: -linux
            use_cross: true

          - os: macos-14
            target: aarch64-apple-darwin
            bin_suffix: -macos
            use_cross: false

    steps:
      - name: Set release tag
        run: echo "RELEASE_TAG=${GITHUB_REF#*refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross == true
        run: cargo install cross

      - name: Build Binary
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename Binary
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/blaise
          OUT=dist/blaise-${{ env.RELEASE_TAG }}${{ matrix.bin_suffix }}
          if [[ ! -f "$BIN" ]]; then
            echo "Binary not found: $BIN"
            exit 1
          fi
          cp "$BIN" "$OUT"

      - name: Strip Binary
        run: strip dist/blaise-${{ env.RELEASE_TAG }}${{ matrix.bin_suffix }}

      - name: Compress Binary
        run: gzip -9 dist/blaise-${{ env.RELEASE_TAG }}${{ matrix.bin_suffix }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
